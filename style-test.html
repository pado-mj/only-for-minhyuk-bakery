<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual Asset Style Test</title><link rel="stylesheet" href="/src/style.css"></head><body><main class="app"><p class="eyebrow">ONLY FOR MINHYUK BAKERY</p><h2>Visual Asset Style Test</h2><p style="text-align:center">Vintage Bakery × Scrapbook × Paper Sticker</p><div class="asset-grid" id="sheet"></div></main><script>const a=['strawberry','cherry','blueberry','ribbon','maltese','chihuahua','shepherd','whale','rose','cucumber','mintchoco','classic-candle','heart-candle','dog-candle',...Array.from({length:10},(_,i)=>'number-'+i)];document.querySelector('#sheet').innerHTML=a.map(x=>`<div class="asset"><img src="/assets/${x}.svg"><span>${x}</span></div>`).join('')</script></body></html>
